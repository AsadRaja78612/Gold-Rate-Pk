<script>

let base = 37500;

function getGold() {

    let randomChange = (Math.random() * 2 - 1);

    base = base + (base * randomChange / 100);

    updateUI(base, randomChange);
}

function updateUI(price, change) {

    let city = document.getElementById("city").value;

    let factor = 1;
    if(city === "Karachi") factor = 1.01;
    if(city === "Islamabad") factor = 1.005;

    let g24 = price * factor;
    let g22 = g24 * 0.916;
    let g21 = g24 * 0.875;

    document.getElementById("gold24").innerHTML = "Rs " + g24.toFixed(0);
    document.getElementById("gold22").innerHTML = "Rs " + g22.toFixed(0);
    document.getElementById("gold21").innerHTML = "Rs " + g21.toFixed(0);

    document.getElementById("change").innerHTML =
        change.toFixed(2) + "% " + (change >= 0 ? "📈" : "📉");
}

getGold();
setInterval(getGold, 10000);

</script>
