<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Gold Rate System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial;
    background:#0f0f0f;
    color:white;
    text-align:center;
    padding:20px;
}

.box{
    background:#1e1e1e;
    padding:20px;
    margin-top:15px;
    border-radius:12px;
}

h1{color:gold;}

.rate{
    font-size:20px;
    margin:10px;
}

button{
    padding:10px 15px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🌍 Live Gold Rate (REAL API)</h1>

<div class="box">
    <div class="rate">USD/Ounce: $<span id="usdOunce">Loading...</span></div>
    <div class="rate">PKR/Gram: Rs <span id="gram">Loading...</span></div>
    <div class="rate">PKR/Tola: Rs <span id="tola">Loading...</span></div>
</div>

<div class="box">
    <button onclick="getRate()">🔄 Refresh Now</button>
</div>

<div class="box">
    <a id="wa" target="_blank">
        <button>📲 WhatsApp Share</button>
    </a>
</div>

<script>

// 🔑 API KEY (agar required ho to yahan lagana)
const API_KEY = "YOUR_API_KEY_HERE";

// PKR rate (you can later make this API too)
const USD_TO_PKR = 280;

// constants
const OUNCE_TO_GRAM = 31.1035;
const GRAM_TO_TOLA = 11.6638;

async function getRate(){

    try{

        // 🌍 REAL API CALL
        let res = await fetch("https://metals-api.com/api/latest?access_key=" + API_KEY);
        let data = await res.json();

        // ✔️ FIXED: correct field
        let usdPerOunce = data.rates["Gold(USDXAU)"];

        // conversions
        let usdPerGram = usdPerOunce / OUNCE_TO_GRAM;
        let pkrPerGram = usdPerGram * USD_TO_PKR;
        let pkrPerTola = pkrPerGram * GRAM_TO_TOLA;

        // UI update
        document.getElementById("usdOunce").innerText = usdPerOunce.toFixed(2);
        document.getElementById("gram").innerText = pkrPerGram.toFixed(0);
        document.getElementById("tola").innerText = pkrPerTola.toFixed(0);

        // WhatsApp message
        let msg =
`🌍 LIVE GOLD RATE
USD/Ounce: $${usdPerOunce.toFixed(2)}
PKR/Gram: Rs ${pkrPerGram.toFixed(0)}
PKR/Tola: Rs ${pkrPerTola.toFixed(0)}`;

        document.getElementById("wa").href =
        "https://wa.me/923115855885?text=" + encodeURIComponent(msg);

    }
    catch(err){
        alert("API Error - key check karo ya internet issue hai");
        console.log(err);
    }
}

// auto refresh every 30 sec
setInterval(getRate, 30000);

// first load
getRate();

</script>

</body>
</html>
