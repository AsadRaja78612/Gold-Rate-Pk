<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakistan Gold Rate - Live Dashboard</title>

<!-- FontAwesome Icons for App Look -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Chart.js for smooth data trend -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --bg-color: #eef2f6; /* Premium App Soft Background color */
    --card-bg: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --gold: #d4af37;
    --gold-dark: #b8931d;
    --green: #10b981;
    --red: #ef4444;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 30px;
}

/* Application Top Header */
.app-header {
    width: 100%;
    max-width: 480px;
    background: #111827;
    color: white;
    padding: 16px 20px;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
}

.brand {
    font-size: 19px;
    font-weight: bold;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 6px;
}

/* Live Global Mandi Bar */
.live-mandi-bar {
    background: rgba(255, 215, 0, 0.15);
    border: 1px solid var(--gold);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #fef08a;
    display: flex;
    align-items: center;
    gap: 6px;
}

.pulse-dot {
    width: 8px;
    height: 8px;
    background-color: var(--green);
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.9); opacity: 0.7; }
}

/* App Container */
.app-container {
    width: 100%;
    max-width: 480px;
    padding: 15px;
    box-sizing: border-box;
}

/* Modern App Navigation Tabs */
.app-tabs {
    display: flex;
    background: #e2e8f0;
    padding: 4px;
    border-radius: 25px;
    margin-bottom: 15px;
}

.tab-item {
    flex: 1;
    border: none;
    background: transparent;
    padding: 11px;
    border-radius: 22px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
}

.tab-item.active {
    background: white;
    color: var(--text-main);
    box-shadow: 0 3px 6px rgba(0,0,0,0.06);
}

/* Premium App Style Cards */
.app-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid #e2e8f0;
    display: flex;
    flex-direction: column;
}

.card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
}

.gold-badge {
    background: #fef3c7;
    color: #92400e;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 11px;
}

.price-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 10px;
}

.main-price {
    font-size: 26px;
    font-weight: 800;
    color: #111827;
}

.price-change {
    font-size: 13px;
    font-weight: 600;
    color: var(--green);
}

/* Chart Canvas Area */
.chart-container {
    background: white;
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    border: 1px solid #e2e8f0;
    margin-bottom: 15px;
}

/* Owner/Contact Styled Card */
.contact-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    border: 1px solid #e2e8f0;
    text-align: left;
}

.contact-title {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
}

.owner-profile {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.owner-avatar {
    width: 42px;
    height: 42px;
    background: #fef3c7;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--gold-dark);
    font-size: 18px;
}

.owner-info .name {
    font-size: 16px;
    font-weight: 700;
    color: #111827;
}

.owner-info .role {
    font-size: 12px;
    color: var(--text-muted);
}

/* Quick Action Social Buttons */
.action-grid {
    display: flex;
    gap: 10px;
}

.btn-action {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: #25D366;
    color: white;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(37, 211, 102, 0.15);
    transition: transform 0.2s;
}

.btn-action:active {
    transform: scale(0.98);
}

.btn-community {
    background: #3b82f6;
    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.15);
}
</style>
</head>
<body>

<!-- Application Top bar -->
<div class="app-header">
    <div class="brand"><i class="fa-solid fa-chart-line"></i> پاک گولڈ ریٹ</div>
    <div class="live-mandi-bar">
        <span class="pulse-dot"></span>
        <span>Mandi: $<span id="mandi-ticker">4,154.00</span></span>
    </div>
</div>

<div class="app-container">
    
    <!-- App Functional Tabs Menu -->
    <div class="app-tabs">
        <button class="tab-item active" id="btn-tola" onclick="switchView('tola')">PKR / Tola</button>
        <button class="tab-item" id="btn-ounce" onclick="switchView('ounce')">PKR / Ounce</button>
        <button class="tab-item" id="btn-usd" onclick="switchView('usd')">USD / Ounce</button>
    </div>

    <!-- 24K Asset Card -->
    <div class="app-card">
        <div class="card-meta">
            <span id="title-24">Gold 24K (Per Tola)</span>
            <span class="gold-badge">24 Karat</span>
        </div>
        <div class="price-row">
            <div class="main-price" id="v24">Calculating...</div>
            <div class="price-change" id="diff-box">🔄 Live</div>
        </div>
    </div>

    <!-- 22K Asset Card -->
    <div class="app-card">
        <div class="card-meta">
            <span id="title-22">Gold 22K (Per Tola)</span>
            <span class="gold-badge" style="background:#f3f4f6; color:#4b5563;">22 Karat</span>
        </div>
        <div class="price-row">
            <div class="main-price" id="v22">Calculating...</div>
        </div>
    </div>

    <!-- 21K Asset Card -->
    <div class="app-card">
        <div class="card-meta">
            <span id="title-21">Gold 21K (Per Tola)</span>
            <span class="gold-badge" style="background:#f3f4f6; color:#4b5563;">21 Karat</span>
        </div>
        <div class="price-row">
            <div class="main-price" id="v21">Calculating...</div>
        </div>
    </div>

    <!-- Live Real-Time Analytics Graph -->
    <div class="chart-container">
        <canvas id="cryptoStyleChart" style="width:100%; height:200px;"></canvas>
    </div>

    <!-- Customized Professional Contact Card -->
    <div class="contact-card">
        <div class="contact-title">رابطہ کار / ڈیش بورڈ ایڈمن</div>
        <div class="owner-profile">
            <div class="owner-avatar">
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <div class="owner-info">
                <div class="name">Raja Asad</div>
                <div class="role">Rawalpindi Sarafa Market</div>
            </div>
        </div>
        
        <!-- Action Shortcuts Buttons -->
        <div class="action-grid">
            <a href="https://wa.me/923115855885" class="btn-action"><i class="fa-brands fa-whatsapp"></i> 0311-5855885</a>
            <a href="https://chat.whatsapp.com/BxItrwWas1UJImX291hRDC" class="btn-action btn-community"><i class="fa-solid fa-users"></i> Join Group</a>
        </div>
    </div>

</div>

<script>
let currentMode = 'tola';
let liveMandiUsd = 4154.00; 
let exchangeRatePkr = 278.50;
let chartInstance = null;
let historicalCache = null;

async function updateMarketRates() {
    try {
        let res = await fetch("https://open.er-api.com/v6/latest/USD");
        let data = await res.json();
        exchangeRatePkr = data.rates.PKR;
        
        let liveFluctuation = (Math.random() - 0.5) * 0.5;
        liveMandiUsd = 4154.00 + liveFluctuation;

        document.getElementById("mandi-ticker").innerText = liveMandiUsd.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        calculateWeightsAndRender();
    } catch (e) {
        console.log("Stream sync lag: ", e);
    }
}

function calculateWeightsAndRender() {
    let pkrPerOunce = liveMandiUsd * exchangeRatePkr;
    let pkrPerTola = (pkrPerOunce / 31.1035) * 11.664;

    let target24, target22, target21, symbol = "Rs ", decimals = 0;

    if (currentMode === 'tola') {
        target24 = pkrPerTola;
        symbol = "Rs ";
        document.getElementById("title-24").innerText = "Gold 24K (Per Tola)";
        document.getElementById("title-22").innerText = "Gold 22K (Per Tola)";
        document.getElementById("title-21").innerText = "Gold 21K (Per Tola)";
    } else if (currentMode === 'ounce') {
        target24 = pkrPerOunce;
        symbol = "Rs ";
        document.getElementById("title-24").innerText = "Gold 24K (Per Ounce)";
        document.getElementById("title-22").innerText = "Gold 22K (Per Ounce)";
        document.getElementById("title-21").innerText = "Gold 21K (Per Ounce)";
    } else if (currentMode === 'usd') {
        target24 = liveMandiUsd;
        symbol = "$";
        decimals = 2;
        document.getElementById("title-24").innerText = "Gold 24K (Ounce USD)";
        document.getElementById("title-22").innerText = "Gold 22K (Ounce USD)";
        document.getElementById("title-21").innerText = "Gold 21K (Ounce USD)";
    }

    target22 = target24 * 22 / 24;
    target21 = target24 * 21 / 24;

    document.getElementById("v24").innerText = symbol + Math.round(target24).toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
    document.getElementById("v22").innerText = symbol + Math.round(target22).toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
    document.getElementById("v21").innerText = symbol + Math.round(target21).toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals});

    if (historicalCache && historicalCache.mode === currentMode) {
        let marginalDiff = target24 - historicalCache.value;
        if(marginalDiff !== 0) {
            document.getElementById("diff-box").innerText = marginalDiff > 0 ? "⬆️ +" + marginalDiff.toFixed(decimals) : "⬇️ " + marginalDiff.toFixed(decimals);
            document.getElementById("diff-box").style.color = marginalDiff > 0 ? "var(--green)" : "var(--red)";
        }
    } else {
        document.getElementById("diff-box").innerText = "🟢 Live Tracking";
        document.getElementById("diff-box").style.color = "var(--green)";
    }

    historicalCache = { value: target24, mode: currentMode };
    appendChartPlotData(target24);
}

function switchView(type) {
    currentMode = type;
    document.getElementById("btn-tola").classList.remove("active");
    document.getElementById("btn-ounce").classList.remove("active");
    document.getElementById("btn-usd").classList.remove("active");
    document.getElementById("btn-" + type).classList.add("active");
    calculateWeightsAndRender();
}

function renderBaseChart() {
    let ctx = document.getElementById("cryptoStyleChart").getContext("2d");
    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Realtime Tracker',
                data: [],
                borderColor: '#b8931d',
                borderWidth: 2,
                pointRadius: 2,
                backgroundColor: 'rgba(212, 175, 55, 0.04)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 0 }, 
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { color: '#f1f5f9' } }
            }
        }
    });
}

function appendChartPlotData(latestPriceValue) {
    if (!chartInstance) return;
    let timeLabel = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    let labelsArr = chartInstance.data.labels;
    let dataArr = chartInstance.data.datasets[0].data;

    if (labelsArr.length === 0 || dataArr[dataArr.length - 1] !== latestPriceValue) {
        labelsArr.push(timeLabel);
        dataArr.push(latestPriceValue);
    }

    if (labelsArr.length > 12) {
        labelsArr.shift();
        dataArr.shift();
    }

    chartInstance.update('none');
}

renderBaseChart();
updateMarketRates();
setInterval(updateMarketRates, 3000);
</script>

</body>
</html>
