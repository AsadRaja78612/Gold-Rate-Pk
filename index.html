<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Rate Live</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle, #2c2c2c, #000);
    color: white;
    text-align: center;
}

.header {
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
    background: gold;
    color: black;
}

.container {
    width: 92%;
    max-width: 520px;
    margin: 20px auto;
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(255,215,0,0.3);
}

.price {
    font-size: 34px;
    margin: 10px 0;
    color: gold;
}

button {
    padding: 10px 18px;
    background: gold;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

canvas {
    margin-top: 20px;
    background: white;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">💰 Live Gold Rate (PKR)</div>

<div class="container">
    <div>Current Gold Price</div>
    <div class="price" id="price">Loading...</div>

    <button onclick="updateGold()">Update Rate</button>

    <canvas id="chart" width="400" height="220"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let gold = 375000;
let labels = [];

const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx, {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            label: "Gold Price Trend",
            data: [],
            borderColor: "gold",
            backgroundColor: "rgba(255,215,0,0.2)",
            fill: true,
            tension: 0.3
        }]
    }
});

function updateGold() {
    let change = (Math.random() * 3000 - 1500);
    gold = Math.round(gold + change);

    document.getElementById("price").innerText = gold + " PKR";

    let time = new Date().toLocaleTimeString();

    chart.data.labels.push(time);
    chart.data.datasets[0].data.push(gold);

    chart.update();
}

// auto start
updateGold();
setInterval(updateGold, 4000);
</script>

</body>
</html>
