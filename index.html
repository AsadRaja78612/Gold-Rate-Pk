<div class="card">
<canvas id="chart"></canvas>
</div>

<script>

let history=[];
let chart;

// safe data
async function getData(){
try{
let res = await fetch("rate.json");
return await res.json();
}catch{
return {
usdToPkr:285,
goldUsd:4300,
silverUsd:30
};
}
}

async function update(){

let data = await getData();

let usdToPkr = data.usdToPkr;

// GOLD
let goldGram = (data.goldUsd / 31.1035) * usdToPkr;
let goldTola24 = goldGram * 11.664;
let gold22 = goldTola24 * 22/24;
let gold21 = goldTola24 * 21/24;

// SILVER (FIXED)
let silverGram = (data.silverUsd / 31.1035) * usdToPkr;
let silverTola = silverGram * 11.664;

// UI
document.getElementById("g24").innerHTML =
"Rs " + Math.round(goldTola24).toLocaleString();

document.getElementById("g22").innerHTML =
"Rs " + Math.round(gold22).toLocaleString();

document.getElementById("g21").innerHTML =
"Rs " + Math.round(gold21).toLocaleString();

document.getElementById("silver").innerHTML =
"Rs " + Math.round(silverTola).toLocaleString();

updateChart(goldTola24);

}

function updateChart(val){

let time = new Date().toLocaleTimeString();

history.push({time,val});

if(history.length > 10) history.shift();

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:history.map(x=>x.time),
datasets:[{
label:"Gold Trend (PKR)",
data:history.map(x=>x.val),
borderColor:"gold",
fill:false
}]
}
});

}

update();
setInterval(update,60000);

</script>
