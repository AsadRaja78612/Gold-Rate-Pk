<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold & Silver Rate PK Live</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.header{
background:#111827;
padding:18px;
font-size:24px;
font-weight:bold;
color:gold;
}

.card{
background:#1f2937;
margin:12px auto;
padding:18px;
border-radius:12px;
max-width:500px;
width:90%;
}

.price{
font-size:28px;
color:gold;
font-weight:bold;
margin-top:8px;
}

.small{
color:#9ca3af;
font-size:13px;
}

a{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

canvas{
background:white;
border-radius:10px;
padding:10px;
}

.footer{
margin-top:20px;
font-size:13px;
color:#9ca3af;
padding:10px;
}
</style>
</head>

<body>

<div class="header">
📊 Rawalpindi Sarafa Bazar Live Rates
</div>

<div class="card">
🌍 Gold 24K (Per Tola)
<div class="price" id="gold24">Loading...</div>
</div>

<div class="card">
🥈 Silver (Per Tola)
<div class="price" id="silver">Loading...</div>
</div>

<div class="card">
📊 Gold 10 Gram
<div class="price" id="gold10">Loading...</div>
</div>

<div class="card">
📱 WhatsApp Updates

<br>

<a href="https://wa.me/923115855885" target="_blank">
📞 0311-5855885
</a>

<br><br>

<a href="https://chat.whatsapp.com/BxItrwWas1UJImX291hRDC" target="_blank">
👥 Join Community
</a>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="footer">
Auto updated Gold & Silver Dashboard
</div>

<script>

let history=[];
let chart;

// Safe fallback (API issues avoid crash)
async function getGold(){
try{
let res=await fetch("https://api.metals.live/v1/spot/gold");
let data=await res.json();
if(Array.isArray(data)) return data[0].price;
throw new Error();
}catch{
return 4300; // fallback USD
}
}

async function getSilver(){
try{
let res=await fetch("https://api.metals.live/v1/spot/silver");
let data=await res.json();
if(Array.isArray(data)) return data[0].price;
throw new Error();
}catch{
return 30; // fallback USD
}
}

async function update(){

let goldUSD=await getGold();
let silverUSD=await getSilver();

const usdToPkr=285;

// Gold calculations
let goldGram=(goldUSD/31.1035)*usdToPkr;
let goldTola=goldGram*11.664;

// Silver calculations
let silverGram=(silverUSD/31.1035)*usdToPkr;
let silverTola=silverGram*11.664;

// UI update
document.getElementById("gold24").innerHTML =
"Rs " + Math.round(goldTola).toLocaleString();

document.getElementById("silver").innerHTML =
"Rs " + Math.round(silverTola).toLocaleString();

document.getElementById("gold10").innerHTML =
"Rs " + Math.round(goldGram*10).toLocaleString();

// chart
updateChart(goldTola);

}

function updateChart(val){

let time=new Date().toLocaleTimeString();

history.push({time,val});
if(history.length>10) history.shift();

if(chart) chart.destroy();

chart=new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:history.map(x=>x.time),
datasets:[{
label:"Gold Trend (PKR)",
data:history.map(x=>x.val),
borderColor:"gold",
fill:false
}]
}
});

}

update();
setInterval(update,60000);

</script>

</body>
</html>
