<script>

// REAL STRUCTURE (NO RANDOM)

let usdPerOunce = 2350;   // <-- yahan real API lagay gi baad me
let usdToPkr = 280;

// constants
const ounceToGram = 31.1035;
const gramToTola = 11.6638;

function updateRate(){

    // USD per gram
    let usdPerGram = usdPerOunce / ounceToGram;

    // PKR values
    let pkrPerGram = usdPerGram * usdToPkr;
    let pkrPerOunce = usdPerOunce * usdToPkr;
    let pkrPerTola = (pkrPerGram * gramToTola);

    // UI update
    document.getElementById("usdOunce").innerText = usdPerOunce.toFixed(2);
    document.getElementById("tola").innerText = pkrPerTola.toFixed(0);
    document.getElementById("gram").innerText = pkrPerGram.toFixed(0);
    document.getElementById("ounce").innerText = pkrPerOunce.toFixed(0);

    document.getElementById("status").innerText = "🟢 Accurate Market Formula Active";

    // WhatsApp
    let msg =
`🌍 Gold Rate Update
USD/Ounce: $${usdPerOunce}
PKR/Tola: Rs ${pkrPerTola.toFixed(0)}
PKR/Gram: Rs ${pkrPerGram.toFixed(0)}`;

    document.getElementById("wa").href =
    "https://wa.me/923115855885?text=" + encodeURIComponent(msg);
}

setInterval(updateRate, 15000);
updateRate();

</script>
