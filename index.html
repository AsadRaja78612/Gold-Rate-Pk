<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rawalpindi Sarafa Live Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
text-align:center;
}

.header{
background:#111827;
padding:18px;
font-size:22px;
font-weight:bold;
color:gold;
}

.card{
background:#1f2937;
margin:10px auto;
padding:16px;
border-radius:12px;
max-width:520px;
width:90%;
}

.price{
font-size:26px;
color:gold;
font-weight:bold;
margin-top:8px;
}

.change{
font-size:14px;
margin-top:5px;
color:#22c55e;
}

a{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:10px 16px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

canvas{
background:white;
border-radius:10px;
padding:10px;
}
</style>
</head>

<body>

<div class="header">
📊 Rawalpindi Sarafa Pro Dashboard
</div>

<div class="card">
🥇 Gold 24K (Tola)
<div class="price" id="g24">Loading...</div>
<div class="change" id="c24"></div>
</div>

<div class="card">
🥇 Gold 22K (Tola)
<div class="price" id="g22">Loading...</div>
</div>

<div class="card">
🥇 Gold 21K (Tola)
<div class="price" id="g21">Loading...</div>
</div>

<div class="card">
📱 WhatsApp Contact

<br>

<a href="https://wa.me/923115855885">0311-5855885</a>

<br><br>

<a href="https://chat.whatsapp.com/BxItrwWas1UJImX291hRDC">Join Community</a>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>

let history = [];
let lastValue = null;
let chart;

// data
async function getData(){
try{
let res = await fetch("rate.json");
return await res.json();
}catch{
return {
usdToPkr:285,
goldUsd:4300
};
}
}

async function update(){

let data = await getData();

let usdToPkr = data.usdToPkr;

let goldGram = (data.goldUsd / 31.1035) * usdToPkr;
let goldTola24 = goldGram * 11.664;

let gold22 = goldTola24 * 22/24;
let gold21 = goldTola24 * 21/24;

// UI
document.getElementById("g24").innerHTML =
"Rs " + Math.round(goldTola24).toLocaleString();

document.getElementById("g22").innerHTML =
"Rs " + Math.round(gold22).toLocaleString();

document.getElementById("g21").innerHTML =
"Rs " + Math.round(gold21).toLocaleString();

// UP / DOWN indicator
if(lastValue){
let diff = goldTola24 - lastValue;

document.getElementById("c24").innerHTML =
diff > 0
? "⬆️ + " + Math.round(diff).toLocaleString()
: "⬇️ - " + Math.abs(Math.round(diff)).toLocaleString();

document.getElementById("c24").style.color =
diff > 0 ? "#22c55e" : "#ef4444";
}

lastValue = goldTola24;

updateChart(goldTola24);

}

function updateChart(val){

let time = new Date().toLocaleTimeString();

history.push({time,val});

if(history.length > 10) history.shift();

if(chart) chart.destroy();

chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:history.map(x=>x.time),
datasets:[{
label:"Gold Trend (24K)",
data:history.map(x=>x.val),
borderColor:"gold",
tension:0.5,
pointRadius:3,
fill:false
}]
},
options:{
responsive:true,
scales:{
x:{display:true},
y:{display:true}
}
}
});

}

update();
setInterval(update,60000);

</script>

</body>
</html>
