<!DOCTYPE html>
<html>
<head>
    <title>Gold Market Pakistan LIVE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #0b1220;
            color: white;
        }

        header {
            background: #111827;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 15px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .card {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .price {
            font-size: 18px;
            color: gold;
        }

        canvas {
            margin-top: 20px;
            background: #111827;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>💰 LIVE GOLD MARKET PAKISTAN</header>

<div class="container">

    <select id="city" onchange="update()">
        <option>Lahore</option>
        <option>Karachi</option>
        <option>Islamabad</option>
    </select>

    <div class="grid">
        <div class="card">
            <h3>24K</h3>
            <div class="price" id="gold24">Loading...</div>
        </div>

        <div class="card">
            <h3>22K</h3>
            <div class="price" id="gold22">Loading...</div>
        </div>

        <div class="card">
            <h3>21K</h3>
            <div class="price" id="gold21">Loading...</div>
        </div>

        <div class="card">
            <h3>Market</h3>
            <div class="price" id="change">LIVE</div>
        </div>
    </div>

    <canvas id="chart"></canvas>

</div>

<script>

let base = 0;
let last = 0;

// LIVE GOLD API
async function getGold() {
    try {
        let res = await fetch("https://api.metals.live/v1/spot/gold");
        let data = await res.json();

        let usd = data[0].price;
        let gram = usd / 31.1035;
        let pkr = gram * 280;

        base = pkr;

        update();
        drawChart(pkr);

    } catch(e) {
        document.getElementById("gold24").innerHTML = "Error";
    }
}

// CITY UPDATE
function update() {

    let city = document.getElementById("city").value;

    let factor = 1;
    if(city === "Karachi") factor = 1.01;
    if(city === "Islamabad") factor = 1.005;

    let g24 = base * factor;
    let g22 = g24 * 0.916;
    let g21 = g24 * 0.875;

    document.getElementById("gold24").innerHTML = "Rs " + g24.toFixed(0);
    document.getElementById("gold22").innerHTML = "Rs " + g22.toFixed(0);
    document.getElementById("gold21").innerHTML = "Rs " + g21.toFixed(0);

    let change = ((g24 - last) / (last || g24)) * 100;
    last = g24;

    document.getElementById("change").innerHTML =
        change.toFixed(2) + "% " + (change >= 0 ? "📈" : "📉");
}

// GRAPH
let chart;
function drawChart(value){

    let ctx = document.getElementById('chart').getContext('2d');

    if(chart) chart.destroy();

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ["Now"],
            datasets: [{
                label: "Live Gold",
                data: [value],
                borderColor: "gold"
            }]
        }
    });
}

// AUTO REFRESH
getGold();
setInterval(getGold, 60000);

</script>

</body>
</html>
