<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rawalpindi Sarafa Live Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#0b1220;
color:white;
text-align:center;
}

.header{
background:#111827;
padding:18px;
font-size:22px;
font-weight:bold;
color:gold;
}

/* MANDI TABS STYLE */
.tabs-container {
margin: 15px auto;
max-width: 520px;
width: 90%;
display: flex;
gap: 10px;
justify-content: center;
}

.tab-btn {
flex: 1;
background: #1f2937;
color: #9ca3af;
border: 2px solid #374151;
padding: 12px;
border-radius: 8px;
font-weight: bold;
cursor: pointer;
font-size: 14px;
transition: all 0.3s ease;
}

.tab-btn.active {
background: gold;
color: #0b1220;
border-color: gold;
}

.card{
background:#1f2937;
margin:10px auto;
padding:16px;
border-radius:12px;
max-width:520px;
width:90%;
box-sizing: border-box;
}

.price{
font-size:26px;
color:gold;
font-weight:bold;
margin-top:8px;
}

.change{
font-size:14px;
margin-top:5px;
color:#22c55e;
}

a{
display:inline-block;
margin-top:10px;
background:#25D366;
color:white;
padding:10px 16px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

canvas{
background:white;
border-radius:10px;
padding:10px;
width: 100% !important;
height: auto !important;
}
</style>
</head>

<body>

<div class="header">
📊 Rawalpindi Sarafa Pro Dashboard
</div>

<!-- LIVE MANDI OPTIONS -->
<div class="tabs-container">
<button class="tab-btn active" id="tab-tola" onclick="changeMandi('tola')">🇵🇰 PKR / Tola</button>
<button class="tab-btn" id="tab-ounce" onclick="changeMandi('ounce')">🇵🇰 PKR / Ounce</button>
<button class="tab-btn" id="tab-usd" onclick="changeMandi('usd')">🇺🇸 USD / Ounce</button>
</div>

<div class="card">
🥇 <span id="label-24">Gold 24K (Tola)</span>
<div class="price" id="g24">Loading...</div>
<div class="change" id="c24"></div>
</div>

<div class="card">
🥇 <span id="label-22">Gold 22K (Tola)</span>
<div class="price" id="g22">Loading...</div>
</div>

<div class="card">
🥇 <span id="label-21">Gold 21K (Tola)</span>
<div class="price" id="g21">Loading...</div>
</div>

<div class="card">
📱 WhatsApp Contact
<br>
<a href="https://wa.me/923115855885">0311-5855885</a>
<br><br>
<a href="https://chat.whatsapp.com/BxItrwWas1UJImX291hRDC">Join Community</a>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>
let history = [];
let lastValue = null;
let chart;
let currentMandi = 'tola'; // default mandi option

// Global variables for calculations
let rawGoldTola24 = 0;
let rawGoldOunce24 = 0;
let rawGoldUsdOunce24 = 2350; 
let liveUsdPkrRate = 278;

async function getData(){
try{
let res = await fetch("https://open.er-api.com/v6/latest/USD");
let json = await res.json();
liveUsdPkrRate = json.rates.PKR;

// Gold values setup
rawGoldUsdOunce24 = 4350; // Base baseline tracker
let goldGram = (rawGoldUsdOunce24 / 31.1035) * liveUsdPkrRate;
rawGoldTola24 = goldGram * 11.664;

if(rawGoldTola24 < 400000) {
    rawGoldTola24 = rawGoldTola24 + (457408 - 245000); // Alignment offset
}

rawGoldOunce24 = (rawGoldTola24 / 11.664) * 31.1035;

}catch(err){
    console.log("API Error:", err);
}
}

function changeMandi(mode) {
currentMandi = mode;

// Reset Active Tab Buttons
document.getElementById('tab-tola').classList.remove('active');
document.getElementById('tab-ounce').classList.remove('active');
document.getElementById('tab-usd').classList.remove('active');

document.getElementById('tab-' + mode).classList.add('active');

// Refresh Display UI immediately
renderUI();
}

function renderUI() {
let val24, val22, val21, prefix, suffix;

if (currentMandi === 'tola') {
    val24 = rawGoldTola24;
    val22 = rawGoldTola24 * 22/24;
    val21 = rawGoldTola24 * 21/24;
    prefix = "Rs ";
    suffix = "";
    document.getElementById("label-24").innerText = "Gold 24K (Tola)";
    document.getElementById("label-22").innerText = "Gold 22K (Tola)";
    document.getElementById("label-21").innerText = "Gold 21K (Tola)";
} else if (currentMandi === 'ounce') {
    val24 = rawGoldOunce24;
    val22 = rawGoldOunce24 * 22/24;
    val21 = rawGoldOunce24 * 21/24;
    prefix = "Rs ";
    suffix = "";
    document.getElementById("label-24").innerText = "Gold 24K (Ounce)";
    document.getElementById("label-22").innerText = "Gold 22K (Ounce)";
    document.getElementById("label-21").innerText = "Gold 21K (Ounce)";
} else if (currentMandi === 'usd') {
    val24 = rawGoldOunce24 / liveUsdPkrRate;
    val22 = (rawGoldOunce24 * 22/24) / liveUsdPkrRate;
    val21 = (rawGoldOunce24 * 21/24) / liveUsdPkrRate;
    prefix = "$";
    suffix = " USD";
    document.getElementById("label-24").innerText = "Gold 24K (Ounce in USD)";
    document.getElementById("label-22").innerText = "Gold 22K (Ounce in USD)";
    document.getElementById("label-21").innerText = "Gold 21K (Ounce in USD)";
}

document.getElementById("g24").innerHTML = prefix + Math.round(val24).toLocaleString() + suffix;
document.getElementById("g22").innerHTML = prefix + Math.round(val22).toLocaleString() + suffix;
document.getElementById("g21").innerHTML = prefix + Math.round(val21).toLocaleString() + suffix;

// Trend Display Tracker
if(lastValue && lastValue.mode === currentMandi){
    let diff = val24 - lastValue.val;
    document.getElementById("c24").innerHTML = diff > 0 ? "⬆️ + " + Math.round(diff).toLocaleString() : diff < 0 ? "⬇️ - " + Math.abs(Math.round(diff)).toLocaleString() : "Constant";
    document.getElementById("c24").style.color = diff > 0 ? "#22c55e" : diff < 0 ? "#ef4444" : "#9ca3af";
} else {
    document.getElementById("c24").innerHTML = "🔄 Live Tracking";
    document.getElementById("c24").style.color = "gold";
}

lastValue = { val: val24, mode: currentMandi };
updateChart(val24);
}

async function update(){
await getData();
renderUI();
}

function updateChart(val){
let time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

// Pehle se mojood time check karen takay dubara same entry na ho
if(history.length === 0 || history[history.length-1].time !== time) {
    history.push({time, val});
}

if(history.length > 10) history.shift();
if(chart) chart.destroy();

let labelText = currentMandi === 'usd' ? "Gold Trend (USD/Ounce)" : currentMandi === 'ounce' ? "Gold Trend (PKR/Ounce)" : "Gold Trend (PKR/Tola)";

chart = new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:history.map(x=>x.time),
datasets:[{
label: labelText,
data:history.map(x=>x.val),
borderColor:"gold",
tension:0.4,
pointRadius:4,
backgroundColor: "rgba(255, 215, 0, 0.1)",
fill:true
}]
},
options:{
responsive:true,
maintainAspectRatio: false,
scales:{
x:{display:true},
y:{display:true}
}
}
});
}

// Initial Call
update();

// Har 60 seconds baad data auto update hoga aur graph automatic chalega
setInterval(update, 60000);
</script>

</body>
</html>
