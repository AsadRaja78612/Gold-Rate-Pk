<!DOCTYPE html>
<html>
<head>
<title>Gold Rate Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#0f0f0f,#1c1c1c);
  color: gold;
}

.header {
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.card {
  background: rgba(255,255,255,0.05);
  margin:20px;
  padding:20px;
  border-radius:15px;
  box-shadow: 0 0 10px rgba(255,215,0,0.2);
}

.price {
  font-size:30px;
  text-align:center;
  margin:10px 0;
}

.btn {
  display:block;
  text-align:center;
  padding:12px;
  margin:10px auto;
  width:80%;
  background:gold;
  color:black;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

select {
  width:100%;
  padding:10px;
  border-radius:10px;
}

.up { color: #00ff99; }
.down { color: #ff4d4d; }
</style>
</head>

<body>

<div class="header">💰 Live Gold Rate</div>

<div class="card">

<select id="currency">
<option value="PKR">PKR</option>
<option value="USD">USD</option>
<option value="AED">AED</option>
</select>

<div class="price" id="goldPrice">Loading...</div>

<div id="status"></div>

<a class="btn" href="https://wa.me/" target="_blank">
📢 Join WhatsApp Updates
</a>

</div>

<script>

let price = 37500;

function updatePrice(){
  let change = (Math.random()*2 - 1);
  let old = price;
  price = price + (price * change / 100);

  let status = document.getElementById("status");

  if(price > old){
    status.innerHTML = "▲ Price Up";
    status.className = "up";
  } else {
    status.innerHTML = "▼ Price Down";
    status.className = "down";
  }

  document.getElementById("goldPrice").innerHTML =
    price.toFixed(2) + " PKR";
}

setInterval(updatePrice, 5000);
updatePrice();

</script>

</body>
</html>
