<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gold Rate Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px;
}
.box{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
}
h1{color:gold;}
.rate{
    font-size:22px;
    margin:10px 0;
}
button{
    padding:12px 18px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>💰 Live Gold Rate System</h1>

<div class="box">
    <h2>Current 24K Gold Rate</h2>
    <div class="rate">Per Tola: <span id="tola"></span> PKR</div>
    <div class="rate">Per Gram: <span id="gram"></span> PKR</div>
    <div class="rate">Per Ounce: <span id="ounce"></span> PKR</div>
</div>

<div class="box">
    <h2>WhatsApp Contact</h2>
    <p>For latest update or order</p>
    
    <a href="https://wa.me/923115855885" target="_blank">
        <button>📲 WhatsApp Now</button>
    </a>
</div>

<script>
// ===== BASE GOLD RATE (CHANGE ONLY THIS) =====
let perTola = 385000;   // 24K tola rate

// conversions
let gramRate = perTola / 11.6638;
let ounceRate = gramRate * 31.1035;

// show on UI
document.getElementById("tola").innerText = perTola.toFixed(0);
document.getElementById("gram").innerText = gramRate.toFixed(0);
document.getElementById("ounce").innerText = ounceRate.toFixed(0);
</script>

</body>
</html>
