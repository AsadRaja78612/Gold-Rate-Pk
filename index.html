<!DOCTYPE html>
<html>
<head>
  <title>Live Gold Rate Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #111827;
      padding: 20px;
      margin: 10px auto;
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 0 10px #000;
    }
    .price {
      font-size: 28px;
      color: gold;
      font-weight: bold;
    }
    a {
      color: #25D366;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>📊 Live Gold Rate Dashboard</h2>

<div class="card">
  <div>🌍 International Gold (USD/oz)</div>
  <div class="price" id="goldPrice">Loading...</div>
</div>

<div class="card">
  <div>🇵🇰 PKR Rate (Per 10g)</div>
  <div class="price" id="pkrRate">Loading...</div>
</div>

<div class="card">
  <div>🪙 21K Gold (11.664g Tola)</div>
  <div class="price" id="tolaRate">Loading...</div>
</div>

<div class="card">
  📱 WhatsApp Update:
  <br>
  <a href="https://wa.me/923115855885" target="_blank">
    Click to Join Community
  </a>
</div>

<div class="card">
  <canvas id="chart"></canvas>
</div>

<script>
const API_KEY = "YOUR_API_KEY"; // metals-api key
let chart;
let history = [];

async function fetchGold() {
  try {
    let res = await fetch(`https://metals-api.com/api/latest?access_key=${API_KEY}&base=USD&symbols=XAU`);
    let data = await res.json();

    let goldPerOz = 1 / data.rates.XAU; // inverse rate
    let usdToPkr = 280; // manual approx (you can update)

    let perGram = goldPerOz / 31.1035;
    let tola21k = perGram * 11.664 * 0.875; // 21K purity

    let pkrRate = perGram * usdToPkr * 10;

    document.getElementById("goldPrice").innerText = goldPerOz.toFixed(2) + " USD";
    document.getElementById("pkrRate").innerText = "Rs " + pkrRate.toFixed(0);
    document.getElementById("tolaRate").innerText = "Rs " + tola21k.toFixed(0);

    updateChart(pkrRate);

  } catch (e) {
    document.getElementById("goldPrice").innerText = "API Error";
  }
}

function updateChart(value) {
  let time = new Date().toLocaleTimeString();
  history.push({ time, value });

  if (history.length > 10) history.shift();

  let ctx = document.getElementById('chart').getContext('2d');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: history.map(h => h.time),
      datasets: [{
        label: 'Gold PKR Trend',
        data: history.map(h => h.value),
        borderColor: 'gold',
        fill: false
      }]
    }
  });
}

fetchGold();
setInterval(fetchGold, 60000);
</script>

</body>
</html>
