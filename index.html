<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Rate PK Live</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
text-align:center;
}

.header{
background:#111827;
padding:20px;
font-size:28px;
font-weight:bold;
color:gold;
}

.card{
background:#1f2937;
margin:15px auto;
padding:20px;
border-radius:15px;
max-width:500px;
width:90%;
box-shadow:0 0 10px rgba(255,215,0,0.2);
}

.price{
font-size:30px;
font-weight:bold;
color:gold;
margin-top:10px;
}

.update{
color:#9ca3af;
font-size:14px;
}

.whatsapp{
display:inline-block;
background:#25D366;
color:white;
padding:12px 25px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:10px;
}

canvas{
background:white;
border-radius:10px;
padding:10px;
}

.footer{
margin-top:20px;
padding:15px;
font-size:14px;
color:#9ca3af;
}
</style>
</head>

<body>

<div class="header">
📊 Gold Rate PK Live
</div>

<div class="card">
🌍 International Gold (USD/Oz)
<div id="usd" class="price">Loading...</div>
</div>

<div class="card">
🇵🇰 Gold Rate PKR (10 Gram)
<div id="pkr10g" class="price">Loading...</div>
</div>

<div class="card">
🪙 Gold Rate PKR (24K Tola)
<div id="tola24k" class="price">Loading...</div>
</div>

<div class="card">
📱 Daily Gold Rate Updates
<br><br>
<a class="whatsapp" href="https://wa.me/923115855885" target="_blank">
Join WhatsApp
</a>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

<div class="footer">
Powered by Gold Rate PK
</div>

<script>

let chart;
let history=[];

async function getGoldPrice(){

try{

let response=await fetch(
"https://api.metals.live/v1/spot/gold"
);

let data=await response.json();

if(Array.isArray(data)){
return data[0].price;
}

throw new Error();

}
catch{

return null;

}

}

async function updateGold(){

let goldUSD=await getGoldPrice();

if(!goldUSD){

document.getElementById("usd").innerHTML="API Error";
return;

}

const usdToPkr=285;

let gram24k=(goldUSD/31.1035)*usdToPkr;

let rate10g=gram24k*10;

let rateTola=gram24k*11.664;

document.getElementById("usd").innerHTML=
goldUSD.toFixed(2)+" USD";

document.getElementById("pkr10g").innerHTML=
"Rs "+Math.round(rate10g).toLocaleString();

document.getElementById("tola24k").innerHTML=
"Rs "+Math.round(rateTola).toLocaleString();

updateChart(rateTola);

}

function updateChart(price){

let time=new Date().toLocaleTimeString();

history.push({
time:time,
price:price
});

if(history.length>12){
history.shift();
}

if(chart){
chart.destroy();
}

chart=new Chart(
document.getElementById("chart"),
{
type:"line",
data:{
labels:history.map(x=>x.time),
datasets:[{
label:"24K Tola Trend",
data:history.map(x=>x.price),
borderColor:"gold",
borderWidth:3,
fill:false
}]
}
}
);

}

updateGold();

setInterval(updateGold,60000);

</script>

</body>
</html>
